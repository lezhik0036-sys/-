name: real-server-pilot

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "HTTPS FastAPI base URL (required; no debug/fake backend)"
        required: true
        type: string
  push:
    branches:
      - release/android-real-server-pilot-no-fake

permissions:
  contents: read

jobs:
  pilot-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Set repository variable MAMA_FASTAPI_BASE_URL for branch builds, or
      # supply backend_url when manually dispatching from GitHub Actions.
      FASTAPI_URL: ${{ inputs.backend_url || vars.MAMA_FASTAPI_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require an explicitly configured HTTPS server
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FASTAPI_URL:-}" ]; then
            echo "::error::MAMA_FASTAPI_BASE_URL is not configured. Real Pilot cannot be built without the actual FastAPI HTTPS hostname."
            exit 1
          fi
          python3 - <<'PY'
          import ipaddress, os, urllib.parse
          value = os.environ["FASTAPI_URL"]
          u = urllib.parse.urlsplit(value)
          host = (u.hostname or "").rstrip(".").lower()
          if (u.scheme != "https" or not host or u.username or u.password
              or u.path not in ("", "/") or u.query or u.fragment):
              raise SystemExit("Invalid HTTPS FastAPI base URL: no credentials, path, query or fragment allowed")
          # Reject CI placeholders, internal-only targets and IP literals.
          # An APK pointing at any of these is not a usable real-server pilot.
          forbidden_suffixes = (".invalid", ".test", ".example", ".localhost", ".local", ".internal")
          if (host in ("localhost", "example.com", "example.org", "example.net",
                       "test", "invalid", "internal") or host.endswith(forbidden_suffixes)):
              raise SystemExit("Pilot backend cannot be a reserved/placeholder hostname")
          try:
              ipaddress.ip_address(host)
          except ValueError:
              pass
          else:
              raise SystemExit("Pilot backend requires a DNS hostname, not an IP literal")
          if "." not in host:
              raise SystemExit("Pilot backend requires a publicly qualified DNS hostname")
          print("Real-server pilot hostname configured; no fake-backend fallback.")
          PY
      # A configured URL is not proof that FastAPI is actually running there.
      # Refuse to publish a misleading real-server APK if TLS, routing or the
      # MAMA API itself is unavailable. This probe never triggers SMS.
      - name: Probe real FastAPI HTTPS health before packaging
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --connect-timeout 8 --max-time 20 --retry 2 --retry-delay 1 \
            --output /tmp/mama-api-health.json "${FASTAPI_URL%/}/health"
          python3 - <<'PY'
          import json
          with open("/tmp/mama-api-health.json", "rb") as handle:
              body = handle.read(4097)
          if len(body) > 4096:
              raise SystemExit("MAMA FastAPI health reply is unexpectedly large")
          try:
              health = json.loads(body)
          except (ValueError, UnicodeDecodeError):
              raise SystemExit("MAMA FastAPI health reply is not valid JSON")
          if not isinstance(health, dict) or health.get("status") != "ok" or health.get("service") != "mama-api":
              raise SystemExit("HTTPS endpoint is not the expected MAMA FastAPI service")
          print("MAMA FastAPI HTTPS health: PASS (does not imply OTP delivery readiness)")
          PY
      - name: Build installable non-test Pilot APK
        run: ./gradlew :app:assemblePilot "-PmamaBackendBaseUrl=$FASTAPI_URL" --console=plain
      - name: Verify NO test codes or simulated credits
        shell: bash
        run: |
          set -euo pipefail
          f=$(find app/build/generated -path '*pilot*' -name BuildConfig.java | head -n 1)
          test -n "$f" && test -s "$f"
          grep -q 'TEST_MODE = false' "$f"
          grep -q 'PILOT_TEST_CREDITS = false' "$f"
          grep -Fq 'MAMA_BACKEND_BASE_URL = "https://' "$f"
          echo "Real Pilot: TEST_MODE=false, PILOT_TEST_CREDITS=false, HTTPS backend embedded."
      - name: Audit APK signature and permissions
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/pilot/app-pilot.apk
          test -s "$apk"
          tools_dir="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)"
          "${tools_dir}apksigner" verify --verbose "$apk"
          "${tools_dir}aapt2" dump permissions "$apk" > /tmp/pilot-permissions.txt
          if grep -Fq 'android.permission.SEND_SMS' /tmp/pilot-permissions.txt; then
            echo "::error::Real Pilot must send SMS through Ktor, never through Android."
            exit 1
          fi
      - name: Archive exact APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/pilot/app-pilot.apk out/MAMA-0.8.23-real-server-pilot.apk
          (cd out && sha256sum MAMA-0.8.23-real-server-pilot.apk | tee MAMA-0.8.23-real-server-pilot.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: MAMA-0.8.23-real-server-pilot
          path: out/*
          retention-days: 14
