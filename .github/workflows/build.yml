name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: ./gradlew :core:test --console=plain
      - name: App startup tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Name the APK after its version
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/MAMA-v$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: MAMA-v${{ steps.apk.outputs.version }}
          path: out/*.apk

  # The APK must actually open on Android, not just compile.
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug APK and launch test APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Launch on emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            .github/scripts/launch-check.sh
            .github/scripts/screenshots.sh
            ./gradlew :app:connectedDebugAndroidTest --console=plain
      # Screenshots of every screen for visual review: a "ui-screenshots"
      # pre-release, replaced on every push to a claude/* branch.
      - name: Publish UI screenshots
        if: ${{ !cancelled() && startsWith(github.ref_name, 'claude/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shots/*.png > /dev/null 2>&1 || { echo 'no screenshots'; exit 0; }
          pip install --quiet pillow
          python3 .github/scripts/shots_to_jpg.py
          gh release delete ui-screenshots --yes --cleanup-tag || true
          gh release create ui-screenshots shots_jpg/*.jpg --prerelease --target "$GITHUB_SHA" \
            --title "UI screenshots (CI)" --notes "Screens of MAMA $GITHUB_SHA rendered on an Android 14 emulator (Pixel 6), preview mode with sample data."
