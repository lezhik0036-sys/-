name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Ephemeral PostgreSQL for the durable Trusted Exit tests (no real SMS, fake provider).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mama
          POSTGRES_PASSWORD: mama
          POSTGRES_DB: mama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Robolectric fetches its instrumented android-all SDK jars (API 26/30/34)
      # from Maven into ~/.m2 at test time. Caching that directory makes repeat
      # runs resolve the SDK offline, so the app unit tests stop depending on a
      # live network fetch. The restore-keys let an older cache (already holding
      # the jars) be reused even when the test sources change.
      - name: Cache Robolectric android-all SDKs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-sdks-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}-${{ hashFiles('app/src/test/**/*.kt') }}
          restore-keys: |
            robolectric-sdks-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}-
            robolectric-sdks-${{ runner.os }}-
      - name: Core tests
        run: ./gradlew :core:test --console=plain
      - name: Trusted Exit backend tests (ephemeral PostgreSQL, fake SMS)
        env:
          MAMA_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/mama_test
          MAMA_TEST_DATABASE_USER: mama
          MAMA_TEST_DATABASE_PASSWORD: mama
        run: ./gradlew :backend:test --console=plain
      # Deterministic Robolectric run: retries ONLY a classified android-all
      # SDK-download flake (MavenArtifactFetcher network fault), never a genuine
      # test failure. No test is skipped or weakened. See the two scripts.
      - name: App startup tests (Robolectric)
        run: bash .github/scripts/robolectric-tests.sh
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Reject release packaging without approved HTTPS and owner signing inputs
        run: |
          if ./gradlew :app:verifyMamaReleaseInputs --console=plain > release-preflight.log 2>&1; then
            echo "Release unexpectedly accepted a missing backend URL"
            exit 1
          fi
          grep -F 'MAMA release requires -PmamaBackendBaseUrl=' release-preflight.log
          if ./gradlew :app:verifyMamaReleaseInputs -PmamaBackendBaseUrl=https://api.mama-app.ru --console=plain > release-preflight.log 2>&1; then
            echo "Release unexpectedly accepted missing signing inputs"
            exit 1
          fi
          grep -F 'MAMA_RELEASE_KEYSTORE must point' release-preflight.log
          ./gradlew :app:bundleRelease --dry-run --console=plain | tee release-task-graph.log
          grep -F ':app:verifyMamaReleaseInputs' release-task-graph.log
      - name: Inspect the actual release APK and Ktor jar
        shell: bash
        run: |
          set -euo pipefail
          export MAMA_RELEASE_KEYSTORE="$RUNNER_TEMP/artifact-audit.jks"
          export MAMA_RELEASE_STORE_PASSWORD=ci-only-artifact-audit
          export MAMA_RELEASE_KEY_PASSWORD="$MAMA_RELEASE_STORE_PASSWORD"
          export MAMA_RELEASE_KEY_ALIAS=artifact-audit
          keytool -genkeypair -keystore "$MAMA_RELEASE_KEYSTORE" -alias "$MAMA_RELEASE_KEY_ALIAS" \
            -storepass "$MAMA_RELEASE_STORE_PASSWORD" -keypass "$MAMA_RELEASE_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=CI artifact audit only'
          ./gradlew :app:assembleRelease :backend:jar -PmamaBackendBaseUrl=https://api.mama-app.ru --console=plain
          python3 .github/scripts/check-release-artifacts.py app/build/outputs/apk/release/app-release.apk backend/build/libs/*.jar
      - name: Release build has no test credits
        run: |
          ./gradlew :app:generateReleaseBuildConfig --console=plain
          f=$(find app/build/generated -path '*release*' -name BuildConfig.java | head -n 1)
          echo "checking $f"
          grep -q "PILOT_TEST_CREDITS = false" "$f" || { echo "::error::release build enables test credits"; cat "$f"; exit 1; }
          grep -q "TEST_MODE = false" "$f" || { echo "::error::release build enables test/OTP mode"; cat "$f"; exit 1; }
          grep -q "TEST_MODE_ENABLED = false" "$f" || { echo "::error::release build enables the standalone test-mode lock"; cat "$f"; exit 1; }
          d=$(find app/build/generated -path '*debug*' -name BuildConfig.java | head -n 1)
          test -n "$d" && test -s "$d" || { echo "::error::debug BuildConfig missing"; exit 1; }
          grep -q "TEST_MODE = true" "$d" || { echo "::error::smoke-test APK is not in debug test mode"; exit 1; }
          grep -q "TEST_MODE_ENABLED = true" "$d" || { echo "::error::debug field-test APK unexpectedly disables the test-mode lock"; exit 1; }
      - name: Test-mode flag stays wired to BuildConfig (never a hardcoded const)
        shell: bash
        run: |
          set -euo pipefail
          p=app/src/main/kotlin/app/mama/billing/Payments.kt
          grep -q 'app.mama.BuildConfig.TEST_MODE_ENABLED' "$p" || {
            echo "::error::FeatureFlags.TEST_MODE_ENABLED must read BuildConfig.TEST_MODE_ENABLED"; exit 1; }
          if grep -Eq 'const[[:space:]]+val[[:space:]]+TEST_MODE_ENABLED' "$p"; then
            echo "::error::TEST_MODE_ENABLED must not be a hardcoded constant — a real pilot/release APK could ship test mode"; exit 1
          fi
      - name: Pilot build refuses to run without the stable keystore (no debug-signed user APK)
        shell: bash
        run: |
          set -euo pipefail
          # This job has no MAMA_PILOT_* keystore, so a pilot build MUST be refused at
          # configuration (audit #9) rather than fall back to a debug-signed, non-updatable
          # user APK. The build is expected to FAIL with the keystore-required message.
          if ./gradlew :app:assemblePilot -PmamaBackendBaseUrl=https://api.mama-app.ru --console=plain > pilot-refusal.log 2>&1; then
            echo "::error::assemblePilot succeeded without the stable pilot keystore (should be refused)"
            exit 1
          fi
          grep -F 'stable pilot keystore is not configured' pilot-refusal.log
          echo "Pilot build correctly refused without the stable keystore (audit #9)."
      - name: Pilot variant never maps to the debug signing key (no debug fallback)
        shell: bash
        run: |
          set -euo pipefail
          # signingReport lists each variant's signing config WITHOUT building an APK and
          # without the "Pilot" task name that triggers the assemblePilot refusal. With no
          # MAMA_PILOT_* keystore the shipping `pilot` variant must have NO signing config
          # (Config: null) — proving the removed `else "debug"` fallback can never
          # debug-sign a pilot APK via ANY task path, including the aggregate build/assemble
          # that bypasses the explicit refusal (audit #9, re-audit).
          ./gradlew :app:signingReport --console=plain > signing-report.log 2>&1 || { cat signing-report.log; exit 1; }
          python3 - <<'PY'
          import re, sys
          text = open("signing-report.log").read()
          blocks = re.split(r'(?m)^Variant:\s*', text)
          bad = []
          for b in blocks:
              name = b.split('\n', 1)[0].strip().lower()
              if name == "pilot":  # the shipping APK variant, not pilotUnitTest/pilotAndroidTest
                  if "debug.keystore" in b or re.search(r'(?mi)^\s*Config:\s*debug\s*$', b):
                      bad.append(b.strip())
          if bad:
              print("::error::the pilot APK variant maps to the debug signing key")
              print(text); sys.exit(1)
          print("OK: pilot variant has no debug signing config (unsigned without the stable keystore).")
          PY
      - name: Name the APK after its version
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/MAMA-v$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # What is inside this exact file: package, versionCode, versionName; and its checksum.
      - name: APK version and checksum
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          if [ -x "$aapt2" ]; then "$aapt2" dump badging out/*.apk | head -n 1; fi
          cd out && sha256sum MAMA-v*.apk | tee "MAMA-v${{ steps.apk.outputs.version }}.apk.sha256"
      - name: Independently check debug APK signature and archived checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="out/MAMA-v${{ steps.apk.outputs.version }}.apk"
          test -s "$apk"
          (cd out && sha256sum --check "MAMA-v${{ steps.apk.outputs.version }}.apk.sha256")
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          test -x "$apksigner" || { echo "::error::apksigner missing"; exit 1; }
          "$apksigner" verify --verbose --print-certs "$apk" | tee /tmp/mama-apk-signature-audit.txt
          grep -Eq 'Verified using v2 scheme.*true' /tmp/mama-apk-signature-audit.txt || {
            echo "::error::APK Signature Scheme v2 verification failed"; exit 1;
          }
          grep -Eq '(V2 Signer:|Signer #1) certificate DN: .*Android Debug' /tmp/mama-apk-signature-audit.txt || {
            echo "::error::smoke APK was not signed with Android Debug certificate"; exit 1;
          }
      - name: Confirm the APK does not request direct SMS permission
        shell: bash
        run: |
          set -euo pipefail
          apk="out/MAMA-v${{ steps.apk.outputs.version }}.apk"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          test -x "$aapt2"
          "$aapt2" dump permissions "$apk" > /tmp/mama-apk-permissions.txt
          if grep -Fq 'android.permission.SEND_SMS' /tmp/mama-apk-permissions.txt; then
            echo "::error::Android APK requests direct SMS permission although Ktor owns SMS delivery"
            exit 1
          fi
          echo "MAMA backend-only SMS policy: PASS (APK has no SEND_SMS permission)"

  # The APK must actually open on Android, not just compile.
  launch:
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30, 32, 33]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug APK and launch test APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Install and test device identity on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            .github/scripts/launch-check.sh
            ./gradlew :app:connectedDebugAndroidTest --console=plain
