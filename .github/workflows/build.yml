name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Ephemeral PostgreSQL for the durable Trusted Exit tests (no real SMS, fake provider).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mama
          POSTGRES_PASSWORD: mama
          POSTGRES_DB: mama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: ./gradlew :core:test --console=plain
      - name: Trusted Exit backend tests (ephemeral PostgreSQL, fake SMS)
        env:
          MAMA_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/mama_test
          MAMA_TEST_DATABASE_USER: mama
          MAMA_TEST_DATABASE_PASSWORD: mama
        run: ./gradlew :backend:test --console=plain
      - name: App startup tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Release build has no test credits
        run: |
          ./gradlew :app:generateReleaseBuildConfig --console=plain
          f=$(find app/build/generated -path '*release*' -name BuildConfig.java | head -n 1)
          echo "checking $f"
          grep -q "PILOT_TEST_CREDITS = false" "$f" || { echo "::error::release build enables test credits"; cat "$f"; exit 1; }
          grep -q "TEST_MODE = false" "$f" || { echo "::error::release build enables test/OTP mode"; cat "$f"; exit 1; }
          d=$(find app/build/generated -path '*debug*' -name BuildConfig.java | head -n 1)
          test -n "$d" && test -s "$d" || { echo "::error::debug BuildConfig missing"; exit 1; }
          grep -q "TEST_MODE = true" "$d" || { echo "::error::smoke-test APK is not in debug test mode"; exit 1; }
      - name: Name the APK after its version
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/MAMA-v$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # What is inside this exact file: package, versionCode, versionName; and its checksum.
      - name: APK version and checksum
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          if [ -x "$aapt2" ]; then "$aapt2" dump badging out/*.apk | head -n 1; fi
          cd out && sha256sum MAMA-v*.apk | tee "MAMA-v${{ steps.apk.outputs.version }}.apk.sha256"
      - name: Independently check debug APK signature and archived checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="out/MAMA-v${{ steps.apk.outputs.version }}.apk"
          test -s "$apk"
          (cd out && sha256sum --check "MAMA-v${{ steps.apk.outputs.version }}.apk.sha256")
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          test -x "$apksigner" || { echo "::error::apksigner missing"; exit 1; }
          "$apksigner" verify --verbose --print-certs "$apk" | tee /tmp/mama-apk-signature-audit.txt
          grep -Eq 'Verified using v2 scheme.*true' /tmp/mama-apk-signature-audit.txt || {
            echo "::error::APK Signature Scheme v2 verification failed"; exit 1;
          }
          grep -Eq 'Signer #1 certificate DN: .*Android Debug' /tmp/mama-apk-signature-audit.txt || {
            echo "::error::smoke APK was not signed with Android Debug certificate"; exit 1;
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MAMA-v${{ steps.apk.outputs.version }}
          path: out/*
      # The same file as a test-build pre-release, downloadable straight on the phone.
      - name: Publish the test APK
        if: ${{ github.event_name == 'push' && startsWith(github.ref_name, 'claude/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.apk.outputs.version }}"
          tag="test-v$version"
          sum=$(cut -d ' ' -f 1 "out/MAMA-v$version.apk.sha256")
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" "out/MAMA-v$version.apk" "out/MAMA-v$version.apk.sha256" --prerelease --target "$GITHUB_SHA" \
            --title "MAMA $version (debug test build)" \
            --notes "Debug test build of MAMA for field tests, not for production. versionName $version, versionCode ${{ steps.apk.outputs.code }}, commit $GITHUB_SHA. SHA-256 of MAMA-v$version.apk: $sum. Real payments are off."

  # The APK must actually open on Android, not just compile.
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug APK and launch test APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Launch on emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            .github/scripts/launch-check.sh
            .github/scripts/screenshots.sh
            ./gradlew :app:connectedDebugAndroidTest --console=plain
      # Screenshots of every screen for visual review: a "ui-screenshots"
      # pre-release, replaced on every push to a claude/* branch.
      - name: Publish UI screenshots
        if: ${{ !cancelled() && startsWith(github.ref_name, 'claude/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shots/*.png > /dev/null 2>&1 || { echo 'no screenshots'; exit 0; }
          pip install --quiet pillow
          python3 .github/scripts/shots_to_jpg.py
          gh release delete ui-screenshots --yes --cleanup-tag || true
          # Compact JPGs for a quick look, and the same screens at full size (1080 × 2400 PNG) for close review.
          gh release create ui-screenshots shots_jpg/*.jpg shots/*.png --prerelease --target "$GITHUB_SHA" \
            --title "UI screenshots (CI)" --notes "Screens of MAMA $GITHUB_SHA rendered on an Android 14 emulator (Pixel 6), preview mode with sample data."
