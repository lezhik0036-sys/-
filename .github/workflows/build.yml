name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (shared logic, JVM)
        run: ./gradlew :core:jvmTest --console=plain
      - name: App startup tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Release build has no test credits
        run: |
          ./gradlew :app:generateReleaseBuildConfig --console=plain
          f=$(find app/build/generated -path '*release*' -name BuildConfig.java | head -n 1)
          echo "checking $f"
          grep -q "PILOT_TEST_CREDITS = false" "$f" || { echo "::error::release build enables test credits"; cat "$f"; exit 1; }
      - name: Name the APK after its version
        id: apk
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/MAMA-v$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: MAMA-v${{ steps.apk.outputs.version }}
          path: out/*.apk

  # The APK must actually open on Android, not just compile.
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug APK and launch test APK
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Launch on emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            .github/scripts/launch-check.sh
            .github/scripts/screenshots.sh
            ./gradlew :app:connectedDebugAndroidTest --console=plain
      # Screenshots of every screen for visual review: a "ui-screenshots"
      # pre-release, replaced on every push to a claude/* branch.
      - name: Publish UI screenshots
        if: ${{ !cancelled() && startsWith(github.ref_name, 'claude/') && github.ref_name != 'claude/mama-ios' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls shots/*.png > /dev/null 2>&1 || { echo 'no screenshots'; exit 0; }
          pip install --quiet pillow
          python3 .github/scripts/shots_to_jpg.py
          gh release delete ui-screenshots --yes --cleanup-tag || true
          gh release create ui-screenshots shots_jpg/*.jpg --prerelease --target "$GITHUB_SHA" \
            --title "UI screenshots (CI)" --notes "Screens of MAMA $GITHUB_SHA rendered on an Android 14 emulator (Pixel 6), preview mode with sample data."

  # The iPhone app: shared logic on the iOS simulator, the MamaCore framework
  # and an unsigned simulator build (no Apple account needed for this).
  ios:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Select Xcode
        shell: bash
        run: |
          ls -d /Applications/Xcode*.app
          # Kotlin 2.0.21 supports Xcode up to 16.0.
          for v in 15.4 16.0 15.3; do
            if [ -d "/Applications/Xcode_$v.app" ]; then sudo xcode-select -s "/Applications/Xcode_$v.app/Contents/Developer"; break; fi
          done
          xcodebuild -version
      - name: Shared logic on the iOS simulator
        shell: bash
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime in sorted(devices, reverse=True) if 'iOS' in runtime for d in devices[runtime] if d['name'].startswith('iPhone')))
          ")
          echo "simulator $udid"
          ./gradlew :core:iosSimulatorArm64Test -Pmama.simulator="$udid" --console=plain
      - name: MamaCore framework
        run: ./gradlew :core:assembleMamaCoreDebugXCFramework --console=plain
      - name: Generate the Xcode project
        shell: bash
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Build the iPhone app (simulator, unsigned)
        shell: bash
        run: |
          cd iosApp
          xcodebuild -project MAMA.xcodeproj -scheme MAMA -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 300
