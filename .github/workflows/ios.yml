name: ios

# macOS minutes are expensive on private repos, so this runs only when the
# iOS part changes, plus by hand (Actions → ios → Run workflow) for TestFlight.
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Подписать и отправить в TestFlight'
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build for the simulator (no signing)
        run: |
          xcodebuild -project ios/MAMA.xcodeproj -scheme MAMA -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet build

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            [ -n "${!s}" ] || { echo "::error::secret for $s is not set, see ios/README.md"; exit 1; }
          done
      - name: Generate Xcode project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Write the App Store Connect key
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "KEY_PATH=$key" >> "$GITHUB_ENV"
      # Signing is automatic: through the API key Xcode makes the certificate
      # and profiles for the App IDs registered by hand (ios/README.md), so no
      # certificates live in the repo.
      - name: Archive
        run: |
          xcodebuild -project ios/MAMA.xcodeproj -scheme MAMA -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MAMA.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$(date -u +%y%m%d%H%M)" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -quiet archive
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MAMA.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
